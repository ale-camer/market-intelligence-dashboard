server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression (including behind Google Cloud Run proxy via gzip_proxied any)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        text/xml
        application/xml
        image/svg+xml
        font/woff2;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed Vite bundles (/assets/*) — cache 1 year immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Static guide locales, audio narrations, and Open Graph image — cache 7 days
    location ~* \.(mp3|png|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /cloud/p03/ {
        proxy_ssl_server_name on;
        proxy_pass https://p03-market-events-obaffww4hq-uc.a.run.app/;
    }
    location /cloud/p05/ {
        proxy_ssl_server_name on;
        proxy_pass https://p05-hub-api-obaffww4hq-uc.a.run.app/;
    }
    location /cloud/p06/ {
        proxy_ssl_server_name on;
        proxy_pass https://p06-anomaly-api-obaffww4hq-uc.a.run.app/;
    }
    location /cloud/p07/ {
        proxy_ssl_server_name on;
        proxy_pass https://p07-docs-rag-obaffww4hq-uc.a.run.app/;
    }
    location /cloud/p08/ {
        proxy_ssl_server_name on;
        proxy_pass https://p08-market-intel-obaffww4hq-uc.a.run.app/;
    }
    location /cloud/p09/ {
        proxy_ssl_server_name on;
        proxy_pass https://p09-research-agent-obaffww4hq-uc.a.run.app/;
    }
    location /cloud/p10/ {
        proxy_ssl_server_name on;
        proxy_pass https://p10-trading-analyst-obaffww4hq-uc.a.run.app/;
    }
    location /cloud/p11/ {
        proxy_ssl_server_name on;
        proxy_pass https://p11-multi-agent-obaffww4hq-uc.a.run.app/;
    }
    location /cloud/yahoo-rss {
        proxy_ssl_server_name on;
        proxy_set_header Host feeds.finance.yahoo.com;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_pass https://feeds.finance.yahoo.com/rss/2.0/headline;
    }
    location /cloud/yahoo-chart/ {
        proxy_ssl_server_name on;
        proxy_set_header Host query1.finance.yahoo.com;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_pass https://query1.finance.yahoo.com/v8/finance/chart/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

